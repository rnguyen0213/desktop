name: Windows Personal Build

# Builds a Windows x64 installer (.exe) from the branch you pick in
# "Run workflow". No secrets, no PGO, no release is published.
# Output: download "zen-windows-x64" from the run's Artifacts section.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand to build"
        required: true
        default: "twilight"
        type: choice
        options:
          - twilight
          - release
      disable-lto:
        description: "Disable LTO (much faster build, slightly slower browser)"
        required: false
        default: true
        type: boolean

jobs:
  windows:
    name: Build Windows x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      SURFER_COMPAT: x86_64

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y python3 python3-pip dos2unix yasm nasm build-essential libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev xvfb lld llvm --fix-missing

      - name: Load Surfer CI setup
        id: version
        run: |
          npm run surfer -- ci --brand ${{ inputs.brand }}
          echo "version=$(npm run --silent surfer -- get version | xargs)" >> "$GITHUB_OUTPUT"

      - name: Download Firefox and dependencies
        run: npm run download

      - name: Setup for Windows
        run: |
          set -x
          mkdir -p ~/win-cross
          cd engine/
          sudo apt-get -o Acquire::Retries=3 install -y python3-launchpadlib
          sudo add-apt-repository -y ppa:savoury1/backports
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y python3-pip autoconf autoconf2.13 automake bison \
            build-essential cabextract curl cmake flex gawk gcc-multilib git gnupg jq libbz2-dev \
            libexpat1-dev libffi-dev libncursesw5-dev libsqlite3-dev libssl-dev libtool libucl-dev \
            libxml2-dev msitools ninja-build openssh-client p7zip-full pkg-config procps \
            python3-requests python3-toml scons subversion tar unzip uuid uuid-dev wget zip \
            zlib1g-dev aria2
          aria2c "https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.cache.level-3.toolchains.v3.linux64-wine.latest/artifacts/public/build/wine.tar.zst" -o wine.tar.zst
          tar --zstd -xf wine.tar.zst -C ~/win-cross
          rm wine.tar.zst
          ./mach python --virtualenv build taskcluster/scripts/misc/get_vs.py build/vs/vs2026.yaml ~/win-cross/vs2026

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          source $HOME/.cargo/env
          rustup target add x86_64-pc-windows-msvc

      - name: Import
        run: |
          . "$HOME/.cargo/env"
          npm run import -- --verbose

      - name: Bootstrap
        run: |
          set -x
          chmod -R +x ~/win-cross/vs2026 || true
          export SURFER_PLATFORM="win32"
          npm run bootstrap
          echo "export LIB=\"$(cd ~/.mozbuild/clang/lib/clang/* && cd lib/windows && pwd)\"" >> configs/common/mozconfig

      - name: Setup windows-rs
        run: |
          source $HOME/.cargo/env
          WINDOWS_RS_VERSION=$(cat build/windows/.windows-rs-version)
          curl -fsSL "https://static.crates.io/crates/cargo-download/cargo-download-0.1.2.crate" | tar xz -C /tmp
          (cd /tmp/cargo-download-0.1.2 && cargo generate-lockfile && cargo update tinyvec --precise 1.12.0)
          RUSTFLAGS="--cap-lints=allow" cargo install --path /tmp/cargo-download-0.1.2 --locked
          cd engine/
          cargo download -x windows=$WINDOWS_RS_VERSION
          echo "" >> ../configs/common/mozconfig
          echo "export MOZ_WINDOWS_RS_DIR=$(pwd)/windows-$WINDOWS_RS_VERSION" >> ../configs/common/mozconfig

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Build
        env:
          ZEN_RELEASE_BRANCH: ${{ inputs.brand }}
          ZEN_GA_DISABLE_PGO: 1
          ZEN_DISABLE_LTO: ${{ inputs.disable-lto && '1' || '' }}
        run: |
          set -x
          dos2unix configs/windows/mozconfig
          export SURFER_PLATFORM="win32"
          export ZEN_CROSS_COMPILING=1
          bash .github/workflows/src/release-build.sh

      - name: Package
        env:
          ZEN_GA_DISABLE_PGO: 1
        run: |
          set -x
          export SURFER_PLATFORM="win32"
          export ZEN_CROSS_COMPILING=1
          export ZEN_RELEASE=1
          npm run package
          ls ./dist
          mkdir -p out
          mv ./dist/zen.installer.exe out/zen.installer.exe
          mv ./dist/zen-${{ steps.version.outputs.version }}.en-US.win64.zip out/zen.win-x86_64.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: zen-windows-x64
          retention-days: 7
          path: out/
